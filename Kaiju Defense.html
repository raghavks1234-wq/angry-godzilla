<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaiju Defense</title>
<style>
:root{--ink:#e9f0ff;--hot:#ff7a3c;--bg:#050a1c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);overflow:hidden;font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#hud{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:14px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;pointer-events:none}
#pips{display:flex;gap:5px;margin:6px 0 8px}
#pips i{width:15px;height:15px;border-radius:50%;border:2px solid #5b6a95;box-sizing:border-box}
#pips i.on{background:var(--hot);border-color:var(--hot);box-shadow:0 0 8px var(--hot)}
#rl{width:130px;height:5px;background:#1a2340;border-radius:3px;overflow:hidden;margin-top:6px}
#rl b{display:block;height:100%;width:100%;background:#8fd0ff}
#hint{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.6;pointer-events:none;transition:opacity 1s}
#end{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center;display:none;background:rgba(5,10,28,.78);border:1px solid #3a4a7a;border-radius:16px;padding:14px 26px;backdrop-filter:blur(6px)}
#end h2{margin:0 0 4px;font-size:clamp(24px,5vw,40px);letter-spacing:.08em}
#end p{margin:0 0 12px;opacity:.75;font-size:14px}
#end button{font:600 14px/1 inherit;letter-spacing:.12em;padding:11px 24px;border-radius:999px;border:1px solid #8fd0ff;background:rgba(143,208,255,.12);color:var(--ink);cursor:pointer}
#end button:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<canvas id="c" aria-label="Defend the building. Drag back from anywhere to aim, release to fire."></canvas>
<div id="hud"><div>Hits <span id="hn">0</span>/10</div><div id="pips"></div><div>Impact in <span id="tl">25.0</span>s</div><div id="rl"><b id="rb"></b></div></div>
<div id="hint">Drag back to aim · release to fire · 10 hits to win</div>
<div id="end"><h2 id="et"></h2><p id="ep"></p><button id="again" type="button">Play again</button></div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=i=>document.getElementById(i),rnd=Math.random,DUR=25;
let W,H,dpr,gy,K,bw,bh,pvx,pvy,g,vmax,maxD,x0,xEnd,spd,bg;
let state='play',kx,hits=0,tm=0,flash=0,shake=0,reload=0,proj=[],parts=[],aim=null,ang=-.7,recoil=0,mf=0,t=0,last=0,hinted=true;
const pips=$('pips');for(let i=0;i<10;i++)pips.appendChild(document.createElement('i'));

function build(){
  const f=kx===undefined?1:(kx-xEnd)/(x0-xEnd);
  W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;
  gy=H*.88;K=Math.min(H*.5,W*.42);bw=Math.max(W*.13,56);bh=H*.46;pvx=bw*.55;pvy=gy-bh-H*.02;
  g=H*1.6;vmax=Math.sqrt(W*g*.9);maxD=Math.min(W*.3,H*.28);
  x0=W+K*.45;xEnd=bw+K*.45;spd=(x0-xEnd)/DUR;kx=xEnd+f*(x0-xEnd);
  bg=document.createElement('canvas');bg.width=W;bg.height=H;const b=bg.getContext('2d');
  const gr=b.createLinearGradient(0,0,0,gy);gr.addColorStop(0,'#050a1c');gr.addColorStop(1,'#1c2848');b.fillStyle=gr;b.fillRect(0,0,W,H);
  for(let i=0;i<90;i++){b.fillStyle='rgba(255,255,255,'+(.2+rnd()*.6)+')';b.fillRect(rnd()*W,rnd()*gy*.7,1.5,1.5);}
  b.fillStyle='#e8eeff';b.beginPath();b.arc(W*.62,H*.16,H*.045,0,6.3);b.fill();
  for(let x=bw+10;x<W;){const w=20+rnd()*50,h=H*(.08+rnd()*.2);b.fillStyle='#0d1530';b.fillRect(x,gy-h,w,h);x+=w+rnd()*10;}
  b.fillStyle='#090e1c';b.fillRect(0,gy,W,H-gy);b.fillStyle='#1a2340';b.fillRect(0,gy,W,3);
}
function reset(){state='play';hits=0;tm=0;kx=x0;proj=[];parts=[];flash=0;reload=0;$('end').style.display='none';}
function boom(x,y,n,cols){for(let i=0;i<n;i++){const a=rnd()*6.283,v=60+rnd()*260;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,l:0,m:.4+rnd()*.6,c:cols[rnd()*cols.length|0],s:2+rnd()*3});}}

/* hit circles in monster-local units (x forward = negative) */
const HC=[[-.3,.9,.12],[-.1,.75,.17],[.05,.55,.2],[.2,.42,.15],[.5,.3,.11]];

function kaiju(x,mode,ph){
  const dance=mode==='dance',bob=dance?Math.abs(Math.sin(ph/2))*.05:Math.abs(Math.sin(ph))*.02;
  ctx.save();ctx.translate(x,gy);ctx.scale(K,-K);ctx.lineCap='round';ctx.lineJoin='round';
  const c1=flash>0?'#9a5a50':'#2a3a35',c2=flash>0?'#c88a7e':'#43554c',c0=flash>0?'#7a423a':'#1b2724';
  const leg=(hx,a1,a2,col)=>{const L=.22,kx_=hx-Math.sin(a1)*L,ky=.42+bob-Math.cos(a1)*L,fx=kx_-Math.sin(a2)*L,fy=ky-Math.cos(a2)*L;
    ctx.strokeStyle=col;ctx.lineWidth=.13;ctx.beginPath();ctx.moveTo(hx,.44+bob);ctx.lineTo(kx_,ky);ctx.stroke();
    ctx.lineWidth=.1;ctx.beginPath();ctx.moveTo(kx_,ky);ctx.lineTo(fx,fy);ctx.stroke();
    ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(fx-.04,Math.max(fy,.025),.1,.035,0,0,6.283);ctx.fill();};
  const s=Math.sin(ph),cs=Math.cos(ph);
  if(dance){leg(.14,-.42,.1-.1*s,c0);}else{const a=Math.sin(ph+Math.PI);leg(.14,a*.35,a*.35-.15-Math.max(0,Math.cos(ph+Math.PI))*.35,c0);}
  ctx.translate(0,bob);
  // body + tail
  const sway=dance?0:Math.sin(ph*.5)*.03;
  ctx.fillStyle=c1;ctx.beginPath();ctx.moveTo(-.42,.84);ctx.lineTo(-.4,.95);ctx.quadraticCurveTo(-.3,1.02,-.2,.98);ctx.quadraticCurveTo(-.05,.95,.05,.82);
  ctx.quadraticCurveTo(.2,.72,.3,.55);ctx.quadraticCurveTo(.6,.42,1,.16+sway);ctx.quadraticCurveTo(.6,.3,.28,.32);ctx.quadraticCurveTo(.12,.3,.05,.34);
  ctx.quadraticCurveTo(-.2,.4,-.2,.62);ctx.quadraticCurveTo(-.24,.76,-.3,.8);ctx.lineTo(-.34,.78);ctx.closePath();ctx.fill();
  ctx.fillStyle=c2;ctx.beginPath();ctx.ellipse(-.07,.55,.12,.2,.15,0,6.283);ctx.fill();
  // dorsal spines
  const sp=[[-.12,.99],[-.02,.92],[.08,.85],[.18,.74],[.3,.6],[.45,.46],[.6,.35],[.78,.24]];
  for(let i=0;i<sp.length-1;i++){const a=sp[i],b=sp[i+1],k=1-i*.09;ctx.fillStyle=flash>0?'#fff':(i%2?'#ff9a3c':'#ffb865');ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo((a[0]+b[0])/2+.04,(a[1]+b[1])/2+.13*k);ctx.lineTo(b[0],b[1]);ctx.closePath();ctx.fill();}
  // jaw
  const open=dance?.12+.1*Math.abs(s):Math.pow(Math.max(0,Math.sin(t*1.1)),8)*.4;
  ctx.save();ctx.translate(-.2,.8);ctx.rotate(open);ctx.fillStyle=c0;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-.22,0);ctx.lineTo(-.2,-.05);ctx.lineTo(0,-.07);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(-.04-i*.045,0);ctx.lineTo(-.06-i*.045,.03);ctx.lineTo(-.08-i*.045,0);ctx.fill();}ctx.restore();
  // eye / shades
  if(dance){ctx.fillStyle='#000';ctx.fillRect(-.37,.9,.14,.04);ctx.fillRect(-.24,.91,.06,.025);ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(-.35,.925,.04,.008);}
  else{ctx.fillStyle='#ffb020';ctx.beginPath();ctx.ellipse(-.31,.92,.028,.016,.3,0,6.283);ctx.fill();}
  ctx.translate(0,-bob);
  // front leg
  if(dance)leg(-.02,.42,-.1+.1*s,c1);else{const a=Math.sin(ph);leg(-.02,a*.35,a*.35-.15-Math.max(0,cs)*.35,c1);}
  ctx.translate(0,bob);
  // arms
  ctx.strokeStyle=c1;ctx.lineWidth=.05;
  if(dance){
    const hx=-.22+.1*Math.sin(ph),hy=.9+.05*Math.cos(ph);
    ctx.beginPath();ctx.moveTo(-.17,.66);ctx.lineTo(-.3,.78);ctx.lineTo(hx,hy);ctx.stroke();
    ctx.strokeStyle='#d9b36a';ctx.lineWidth=.014;ctx.beginPath();ctx.ellipse(hx,hy+.09,.14,.045,ph*1.5,0,6.283);ctx.stroke();
    ctx.strokeStyle=c1;ctx.lineWidth=.05;ctx.beginPath();ctx.moveTo(-.15,.62);ctx.lineTo(-.28,.56+.03*Math.abs(s));ctx.lineTo(-.34,.62);ctx.stroke();
  }else{ctx.beginPath();ctx.moveTo(-.17,.66);ctx.lineTo(-.25,.58);ctx.lineTo(-.33+.03*s,.6);ctx.stroke();}
  ctx.restore();
}

function drawBuilding(){
  ctx.fillStyle='#0b1328';ctx.fillRect(0,gy-bh,bw,bh);ctx.fillStyle='#16213f';ctx.fillRect(0,gy-bh,bw,4);ctx.fillRect(bw-3,gy-bh,3,bh);
  const cols=Math.max(2,Math.floor(bw/24)),rows=Math.floor(bh/32);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ctx.fillStyle=(r*7+c*13)%5>1?'rgba(255,214,120,.75)':'rgba(40,52,90,.8)';ctx.fillRect(8+c*(bw-16)/cols+2,gy-bh+14+r*32,(bw-16)/cols-6,16);}
  // turret
  const rc=recoil*8;ctx.fillStyle='#1c2748';ctx.fillRect(pvx-18,pvy,36,H*.02+2);ctx.beginPath();ctx.arc(pvx,pvy,13,Math.PI,0);ctx.fill();
  ctx.save();ctx.translate(pvx,pvy);ctx.rotate(ang);ctx.fillStyle='#5c6a96';ctx.fillRect(-rc,-4.5,H*.075,9);ctx.fillStyle='#8fa0d0';ctx.fillRect(H*.075-rc-3,-6,6,12);
  if(mf>0){ctx.fillStyle='rgba(255,200,100,'+mf*3+')';ctx.beginPath();ctx.arc(H*.075+8,0,10+mf*20,0,6.3);ctx.fill();}ctx.restore();
}

function launch(){
  if(!aim)return null;let dx=pvx-aim.x,dy=pvy-aim.y,d=Math.hypot(dx,dy);if(d<8||dx<=0)return null;
  const p=Math.min(d,maxD)/maxD,v=p*vmax;return{vx:dx/d*v,vy:dy/d*v,a:Math.atan2(dy,dx)};
}
function fire(){
  const l=launch();aim=null;if(!l||reload>0||state!=='play')return;
  const L=H*.075;proj.push({x:pvx+Math.cos(l.a)*L,y:pvy+Math.sin(l.a)*L,vx:l.vx,vy:l.vy});
  reload=1;recoil=1;mf=.1;if(hinted){hinted=false;$('hint').style.opacity=0;}
}

function frame(ts){
  const dt=Math.min((ts-last)/1000,.05);last=ts;t+=dt;
  if(state==='play'){
    tm+=dt;kx-=spd*dt;
    if(kx<=xEnd){kx=xEnd;state='lost';shake=1;boom(bw,gy-bh*.5,60,['#ff7a3c','#ffd27a','#fff']);$('et').textContent='YOU LOST';$('ep').textContent='The monster reached the building.';$('end').style.display='block';}
  }
  reload-=dt;recoil=Math.max(0,recoil-dt*4);mf=Math.max(0,mf-dt);flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt*2.5);
  const ph=state==='dance'?t*13.6:(state==='lost'?t*3.2:tm*3.2);
  // projectiles
  for(const p of proj){
    p.vy+=g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.dead=false;
    if(state==='play'){
      const bob=Math.abs(Math.sin(ph))*.02;
      for(const[hx,hy,r]of HC)if(Math.hypot(p.x-(kx+hx*K),p.y-(gy-(hy+bob)*K))<r*K+5){
        p.dead=true;hits++;flash=.15;shake=.5;boom(p.x,p.y,24,['#ff7a3c','#ffd27a','#fff']);
        if(hits>=10){state='dance';t=0;$('et').textContent='YOU WIN!';$('ep').textContent='The monster is dancing. Oppa.';$('end').style.display='block';}
        break;
      }
    }
    if(!p.dead&&p.y>=gy-2){p.dead=true;boom(p.x,gy,12,['#c9a36a','#8b6b44','#ffb865']);}
    if(p.x<-50||p.x>W+80)p.dead=true;
  }
  proj=proj.filter(p=>!p.dead);
  for(const p of parts){p.l+=dt;p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  parts=parts.filter(p=>p.l<p.m);
  if(aim){const l=launch();if(l)ang=l.a;}
  // draw
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  ctx.save();if(shake>0)ctx.translate((rnd()-.5)*shake*14,(rnd()-.5)*shake*14);
  ctx.drawImage(bg,0,0,W,H);
  kaiju(kx,state==='dance'?'dance':'walk',ph);
  drawBuilding();
  // aim preview (short dotted arc, angry-birds style)
  if(aim){const l=launch();if(l){ctx.fillStyle='rgba(220,235,255,.85)';for(let i=1;i<=7;i++){const s=i*.11,L=H*.075,x=pvx+Math.cos(l.a)*L+l.vx*s,y=pvy+Math.sin(l.a)*L+l.vy*s+.5*g*s*s;ctx.globalAlpha=1-i*.1;ctx.beginPath();ctx.arc(x,y,4-i*.28,0,6.3);ctx.fill();}ctx.globalAlpha=1;}
    ctx.strokeStyle='rgba(143,208,255,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pvx,pvy);ctx.lineTo(aim.x,aim.y);ctx.stroke();}
  for(const p of proj){ctx.strokeStyle='rgba(255,190,120,.5)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.02,p.y-p.vy*.02);ctx.stroke();ctx.fillStyle='#ffd7a0';ctx.beginPath();ctx.arc(p.x,p.y,5,0,6.3);ctx.fill();}
  for(const p of parts){ctx.globalAlpha=1-p.l/p.m;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);}
  ctx.globalAlpha=1;ctx.restore();
  // hud
  $('hn').textContent=hits;[...pips.children].forEach((e,i)=>e.className=i<hits?'on':'');
  $('tl').textContent=(state==='play'?Math.max(0,DUR-tm):state==='lost'?0:Math.max(0,DUR-tm)).toFixed(1);
  $('rb').style.width=Math.max(0,Math.min(1,1-reload))*100+'%';
  requestAnimationFrame(frame);
}
cv.addEventListener('pointerdown',e=>{aim={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(aim){aim.x=e.clientX;aim.y=e.clientY;}});
cv.addEventListener('pointerup',fire);
cv.addEventListener('pointercancel',()=>{aim=null;});
$('again').addEventListener('click',reset);
addEventListener('resize',build);
build();kx=x0;requestAnimationFrame(ts=>{last=ts;requestAnimationFrame(frame);});
})();
</script>
</body>
</html>
